name: Release UAT to AKS

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to deploy (e.g., 1.0.0, dev-abc123, or "latest")'
                required: true
                default: "latest"
                type: string
            environment:
                description: "Target environment"
                required: true
                default: "uat"
                type: choice
                options:
                    - uat
                    - staging

permissions:
    id-token: write

env:
    AZURE_RESOURCE_GROUP: rg-hrsm-uat
    AKS_CLUSTER_NAME: hrsm-uat-aks
    NAMESPACE: "${{ github.event.inputs.environment }}"
    DEPLOYMENT_NAME: hrs-email-service
    SERVICE_NAME: hrs-email-service
    ACR_NAME: ${{ secrets.ACR_NAME }}

jobs:
    deploy-to-aks:
        name: Deploy to AKS ${{ github.event.inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}
        permissions:
            contents: read
            actions: read
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

            - name: Set up Azure CLI
              uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Create namespace if not exists
              run: |
                  kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

            - name: Label namespace for Istio sidecar injection
              run: |
                  kubectl label namespace ${{ env.NAMESPACE }} istio-injection=enabled --overwrite

            - name: Attach ACR to AKS (if not already attached)
              run: |
                  az aks update \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --attach-acr $ACR_NAME || echo "ACR already attached or unable to attach"

            - name: Verify image exists in ACR
              run: |
                  echo "🔍 Verifying image exists in ACR..."

                  # List all available tags
                  echo "Available tags:"
                  az acr repository show-tags \
                    --name $ACR_NAME \
                    --repository hrs-email-service \
                    --orderby time_desc \
                    --output table

                  # Check if specific tag exists
                  if az acr repository show-tags \
                      --name $ACR_NAME \
                      --repository hrs-email-service \
                      --output tsv | grep -q "^${{ github.event.inputs.version }}$"; then
                    echo "✅ Image tag '${{ github.event.inputs.version }}' found in ACR"
                  else
                    echo "❌ Image tag '${{ github.event.inputs.version }}' not found in ACR"
                    echo ""
                    echo "Please use one of the available tags listed above or build the image first."
                    exit 1
                  fi

            - name: Prepare deployment manifest
              env:
                  SMTP_HOST: ${{ secrets.SMTP_HOST }}
                  SMTP_PORT: ${{ secrets.SMTP_PORT }}
                  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
                  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
                  FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
                  FROM_NAME: ${{ secrets.FROM_NAME }}
                  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
                  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
                  ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
                  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
              run: |
                  echo "Preparing deployment manifest with secrets..."

                  SMTP_HOST="${SMTP_HOST:-smtp.gmail.com}"
                  SMTP_PORT="${SMTP_PORT:-587}"
                  SMTP_USERNAME="${SMTP_USERNAME:-hikingrentalstore@gmail.com}"
                  FROM_EMAIL="${FROM_EMAIL:-hikingrentalstore@gmail.com}"
                  FROM_NAME="${FROM_NAME:-Hiking Rental Store Team}"
                  ALLOWED_ORIGINS="${ALLOWED_ORIGINS:-http://localhost:4200}"
                  FRONTEND_URL="${FRONTEND_URL:-http://localhost:4200}"

                  # Replace placeholders in the deployment file
                  sed "s|__ACR_NAME__|$ACR_NAME|g" k8s/deployment-uat.yaml | \
                  sed "s|__IMAGE_TAG__|${{ github.event.inputs.version }}|g" | \
                  sed "s|__NAMESPACE__|${{ env.NAMESPACE }}|g" | \
                  sed "s|__SMTP_HOST__|$SMTP_HOST|g" | \
                  sed "s|__SMTP_PORT__|$SMTP_PORT|g" | \
                  sed "s|__SMTP_USERNAME__|$SMTP_USERNAME|g" | \
                  sed "s|__SMTP_PASSWORD__|$SMTP_PASSWORD|g" | \
                  sed "s|__FROM_EMAIL__|$FROM_EMAIL|g" | \
                  sed "s|__FROM_NAME__|$FROM_NAME|g" | \
                  sed "s|__AUTH0_DOMAIN__|$AUTH0_DOMAIN|g" | \
                  sed "s|__AUTH0_AUDIENCE__|$AUTH0_AUDIENCE|g" | \
                  sed "s|__ALLOWED_ORIGINS__|$ALLOWED_ORIGINS|g" | \
                  sed "s|__FRONTEND_URL__|$FRONTEND_URL|g" \
                  > k8s/deployment-final.yaml

                  # Show the final manifest for debugging (mask sensitive values)
                  echo "=== Final Deployment Manifest (sensitive values masked) ==="
                  cat k8s/deployment-final.yaml | grep -v "SMTP_PASSWORD" || cat k8s/deployment-final.yaml

            - name: Deploy to AKS
              run: |
                  echo "🚀 Deploying to AKS..."
                  kubectl apply -f k8s/deployment-final.yaml

                  # Annotate deployment with metadata
                  kubectl annotate deployment/${{ env.DEPLOYMENT_NAME }} \
                    -n ${{ env.NAMESPACE }} \
                    deployment.kubernetes.io/version="${{ github.event.inputs.version }}" \
                    deployment.kubernetes.io/deployed-by="${{ github.actor }}" \
                    deployment.kubernetes.io/deployed-at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                    --overwrite

            - name: Wait for deployment rollout
              run: |
                  echo "⏳ Waiting for deployment to complete..."
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Force restart deployment
              run: |
                  echo "🔄 Forcing deployment restart for clean startup..."
                  kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

            - name: Wait for restart to complete
              run: |
                  echo "⏳ Waiting for restart to complete..."
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Verify deployment
              run: |
                  echo "✅ Deployment completed. Verifying status..."
                  echo ""

                  echo "📦 Deployment status:"
                  kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} -o wide
                  echo ""

                  echo "🔄 Pod status:"
                  kubectl get pods -l app=hrs-email-service -n ${{ env.NAMESPACE }} -o wide
                  echo ""

                  echo "🌐 Service status:"
                  kubectl get service ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }}
                  echo ""

                  echo "📜 Deployment history:"
                  kubectl rollout history deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

            - name: Run smoke tests
              run: |
                  echo "🧪 Running smoke tests..."

                  # Get the service endpoint
                  SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
                  echo "Service IP: $SERVICE_IP"

                  # Port forward for testing (runs in background)
                  kubectl port-forward service/${{ env.SERVICE_NAME }} 8080:80 -n ${{ env.NAMESPACE }} &
                  PORT_FORWARD_PID=$!

                  # Wait for port forward to be ready
                  echo "Waiting for port forward to be ready..."
                  sleep 10

                  # Test health endpoint
                  echo "Testing health endpoint..."
                  if curl -f -s http://localhost:8080/health; then
                    echo ""
                    echo "✅ Health check passed"
                    HEALTH_STATUS="success"
                  else
                    echo ""
                    echo "❌ Health check failed"
                    HEALTH_STATUS="failed"
                  fi

                  # Clean up port forward
                  kill $PORT_FORWARD_PID || true

                  # Exit with error if health check failed
                  if [ "$HEALTH_STATUS" = "failed" ]; then
                    exit 1
                  fi

            - name: Post deployment summary
              if: always()
              run: |
                  echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Service** | Email Service |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Version** | \`${{ github.event.inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Cluster** | \`${{ env.AKS_CLUSTER_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Deployed at** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ job.status }}" == "success" ]; then
                    echo "### ✅ Status: Deployment Successful" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "### ❌ Status: Deployment Failed" >> $GITHUB_STEP_SUMMARY
                  fi

    rollback:
        name: Rollback if needed
        runs-on: ubuntu-latest
        needs: deploy-to-aks
        if: failure()
        environment: ${{ github.event.inputs.environment }}
        permissions:
            contents: read
            actions: read
            id-token: write
        steps:
            - name: Set up Azure CLI
              uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Rollback deployment
              run: |
                  echo "Rolling back deployment..."
                  kubectl rollout undo deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s

                  echo "Rollback completed. Current deployment status:"
                  kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

    Integration-Tests:
        name: Integration-Tests
        runs-on: ubuntu-latest
        needs: deploy-to-aks
        environment: ${{ github.event.inputs.environment }}
        permissions:
            contents: read
            actions: read
            id-token: write
        steps:
            - name: Set up Azure CLI
              uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Wait for deployment availability
              run: |
                  kubectl wait \
                    --namespace=${{ env.NAMESPACE }} \
                    --for=condition=available deployment/${{ env.DEPLOYMENT_NAME }} \
                    --timeout=300s

            - name: Run integration checks against deployed API
              env:
                  BASE_URL: ${{ secrets.UAT_API_ENDPOINT }}
                  FRONTEND_ORIGIN: ${{ secrets.FRONTEND_URL }}
              run: |
                  set -euo pipefail

                  BASE_URL="${BASE_URL%/}"
                  FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"

                  if [ -z "$BASE_URL" ]; then
                    echo "UAT_API_ENDPOINT secret is not set"
                    exit 1
                  fi

                  if [ -z "$FRONTEND_ORIGIN" ]; then
                    echo "FRONTEND_URL secret is not set"
                    exit 1
                  fi

                  BASE_URL="${BASE_URL%/}"
                  FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"
                  echo "Running integration checks against configured UAT endpoint"

                  echo "Checking gateway /health endpoint"
                  curl -sSf "$BASE_URL/health" >/dev/null

                  echo "Checking email service health via gateway route"
                  curl -sSf "$BASE_URL/health/email" >/dev/null

                  echo "Checking CORS preflight for email route"
                  STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "$BASE_URL/api/email/send" \
                    -H "Origin: $FRONTEND_ORIGIN" \
                    -H "Access-Control-Request-Method: POST")

                  if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "204" ] && [ "$STATUS_CODE" != "405" ]; then
                    echo "Unexpected status code for preflight: $STATUS_CODE"
                    exit 1
                  fi

                  echo "Checking POST /api/email/send with JSON media type"
                  POST_STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE_URL/api/email/send" \
                    -H "Origin: $FRONTEND_ORIGIN" \
                    -H "Content-Type: application/json" \
                    -d '{"recipient":"integration-test@example.com","subject":"Integration Test","body":"Validation request","isBodyHtml":false}')

                  if [ "$POST_STATUS_CODE" = "415" ]; then
                    echo "POST request returned 415 Unsupported Media Type"
                    exit 1
                  fi

                  echo "Integration checks passed"

            - name: Post integration test summary
              if: always()
              env:
                  GATEWAY_ENDPOINT: ${{ secrets.UAT_API_ENDPOINT }}
                  FRONTEND_ORIGIN: ${{ secrets.FRONTEND_URL  }}
              run: |
                  echo "## 🧪 Integration Test Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Service** | Email Service |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Version** | \`${{ github.event.inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Endpoint** | \`${GATEWAY_ENDPOINT}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Frontend Origin** | \`${FRONTEND_ORIGIN}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ job.status }}" == "success" ]; then
                    echo "### ✅ Status: Integration Tests Passed" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "### ❌ Status: Integration Tests Failed" >> $GITHUB_STEP_SUMMARY
                  fi
