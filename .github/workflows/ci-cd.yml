name: HRS Email Service CI/CD

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]
        paths-ignore:
            - "**.md"
            - ".gitignore"
            - "docs/**"

permissions:
    contents: read
    pull-requests: write
    security-events: write

env:
    DOTNET_VERSION: "8.0.x"
    ACR_NAME: hrsmacr
    IMAGE_NAME: hrs-email-service

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        outputs:
            image-tag: ${{ steps.meta.outputs.tags }}
            image-repository: ${{ steps.meta.outputs.repository }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Run tests
              run: |
                  if [ -d "tests" ] || [ -d "test" ]; then
                    dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
                  else
                    echo "No test projects found, skipping tests."
                  fi

            - name: Publish test results
              uses: EnricoMi/publish-unit-test-result-action@v2
              if: always() && (hashFiles('**/*.trx') != '')
              with:
                  files: "**/*.trx"

    lint:
        name: Lint and Code Quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Check code formatting
              run: |
                  dotnet format --verify-no-changes --verbosity diagnostic || echo "Code formatting issues found"

            - name: Run code analysis
              run: |
                  dotnet build --configuration Release /p:TreatWarningsAsErrors=false /p:RunAnalyzers=true

    security-scan:
        name: Security Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Check for vulnerable packages
              run: |
                  dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
                  if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
                    echo "::warning::Vulnerable packages found. Please review and update."
                    cat vulnerable-packages.txt
                  else
                    echo "No vulnerable packages found."
                  fi

            - name: Check for deprecated packages
              run: |
                  dotnet list package --deprecated 2>&1 | tee deprecated-packages.txt
                  if grep -q "has the following deprecated packages" deprecated-packages.txt; then
                    echo "::warning::Deprecated packages found. Consider updating."
                    cat deprecated-packages.txt
                  else
                    echo "No deprecated packages found."
                  fi

    docker-build:
        name: Build & Push Docker Image to ACR
        runs-on: ubuntu-latest
        needs: [build, lint, security-scan]
        if: github.event_name == 'push'
        environment: uat
        outputs:
            version: ${{ steps.version.outputs.version }}
            image-tag: ${{ steps.version.outputs.image_tag }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Nerdbank.GitVersioning
              run: dotnet tool install --global nbgv

            - name: Determine version
              id: version
              run: |
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                    # Tagged release: v1.2.3 → 1.2.3
                    VERSION=${GITHUB_REF#refs/tags/v}
                    IMAGE_TAG="$VERSION"
                    echo "📦 Building RELEASE version: $VERSION"
                  else
                    # Development build: use valid SemVer with prerelease tag
                    SHORT_SHA=$(git rev-parse --short HEAD)
                    # Get version from nbgv, but use valid SemVer format: 1.0.1-dev.abc123
                    BASE_VERSION=$(nbgv get-version -v Version | cut -d'.' -f1-3)
                    VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
                    IMAGE_TAG="dev-${SHORT_SHA}"
                    echo "📦 Building DEV version: $VERSION (image tag: $IMAGE_TAG)"
                  fi

                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Azure
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Log in to Azure Container Registry
              run: |
                  az acr login --name ${{ secrets.ACR_NAME }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                  tags: |
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:${{ steps.version.outputs.image_tag }}
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:latest
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

            - name: Create deployment info
              run: |
                  mkdir -p artifacts
                  cat > artifacts/deployment-info.txt <<EOF
                  VERSION=${{ steps.version.outputs.version }}
                  IMAGE_TAG=${{ steps.version.outputs.image_tag }}
                  COMMIT_SHA=${{ github.sha }}
                  BRANCH=${{ github.ref_name }}
                  BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
                  TRIGGERED_BY=${{ github.actor }}
                  EOF

                  echo "📄 Deployment Info:"
                  cat artifacts/deployment-info.txt

            - name: Upload deployment info
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-info
                  path: artifacts/deployment-info.txt
                  retention-days: 30
