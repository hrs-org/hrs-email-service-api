---
# HRS Email Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: hrs-email-service
    namespace: email
    labels:
        app: hrs-email-service
spec:
    replicas: 2
    selector:
        matchLabels:
            app: hrs-email-service
    template:
        metadata:
            labels:
                app: hrs-email-service
        spec:
            containers:
                - name: hrs-email-service
                  image: __ACR_NAME__.azurecr.io/hrs-email-service:__IMAGE_TAG__
                  ports:
                      - containerPort: 8080
                        name: http
                  env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: "Production"
                      # SMTP Configuration
                      - name: Email__SmtpHost
                        value: "__SMTP_HOST__"
                      - name: Email__SmtpPort
                        value: "__SMTP_PORT__"
                      - name: Email__SmtpUsername
                        value: "__SMTP_USERNAME__"
                      - name: Email__SmtpPassword
                        value: "__SMTP_PASSWORD__"
                      - name: Email__FromEmail
                        value: "__FROM_EMAIL__"
                      - name: Email__FromName
                        value: "__FROM_NAME__"
                      - name: Email__FrontendUrl
                        value: "__FRONTEND_URL__"
                      # CORS Configuration
                      - name: AllowedOrigins
                        value: "__ALLOWED_ORIGINS__"
                  livenessProbe:
                      httpGet:
                          path: /health/live
                          port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health/ready
                          port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "256Mi"
                          cpu: "250m"
            imagePullSecrets:
                - name: acr-secret

---
# HRS Email Service
apiVersion: v1
kind: Service
metadata:
    name: hrs-email-service
    namespace: email
    labels:
        app: hrs-email-service
spec:
    type: ClusterIP
    ports:
        - port: 80
          targetPort: 8080
          protocol: TCP
          name: http
    selector:
        app: hrs-email-service
