---
# HRS Email Service Account
# Security: automountServiceAccountToken is disabled because this service
# only sends emails via SMTP and does not require Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: hrs-email-service-sa
    namespace: __NAMESPACE__
automountServiceAccountToken: false

---
# HRS Email Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: hrs-email-service
    namespace: __NAMESPACE__
    labels:
        app: hrs-email-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: hrs-email-service
    template:
        metadata:
            labels:
                app: hrs-email-service
        spec:
            serviceAccountName: hrs-email-service-sa
            # SNYK-CC-K8S-6: Add security context at pod level
            securityContext:
                runAsNonRoot: true
                runAsUser: 10002 # High UID to avoid host conflicts
                fsGroup: 10002
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: hrs-email-service
                  image: __ACR_NAME__.azurecr.io/hrs-email-service:__IMAGE_TAG__
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                        name: http
                  env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: "Production"
                      # SMTP Configuration
                      - name: Email__SmtpHost
                        value: "__SMTP_HOST__"
                      - name: Email__SmtpPort
                        value: "__SMTP_PORT__"
                      - name: Email__SmtpUsername
                        value: "__SMTP_USERNAME__"
                      - name: Email__SmtpPassword
                        value: "__SMTP_PASSWORD__"
                      - name: Email__FromEmail
                        value: "__FROM_EMAIL__"
                      - name: Email__FromName
                        value: "__FROM_NAME__"
                      - name: Email__FrontendUrl
                        value: "__FRONTEND_URL__"
                      # Auth0 Configuration
                      - name: Auth0__Domain
                        value: "__AUTH0_DOMAIN__"
                      - name: Auth0__Audience
                        value: "__AUTH0_AUDIENCE__"
                      # CORS Configuration
                      - name: AllowedOrigins
                        value: "__ALLOWED_ORIGINS__"
                  # SNYK-CC-K8S-9, 10, 11, 8, 42: Add container security context
                  securityContext:
                      allowPrivilegeEscalation: false # SNYK-CC-K8S-8
                      privileged: false # SNYK-CC-K8S-9
                      runAsNonRoot: true # SNYK-CC-K8S-10
                      runAsUser: 10002 # SNYK-CC-K8S-10 (high UID)
                      readOnlyRootFilesystem: true # SNYK-CC-K8S-6
                      capabilities:
                          drop:
                              - ALL # SNYK-CC-K8S-11, 42
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      - name: aspnet-tmp
                        mountPath: /app/.aspnet
                  livenessProbe:
                      httpGet:
                          path: /health/live
                          port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health/ready
                          port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                          ephemeral-storage: "512Mi"
                      limits:
                          memory: "256Mi"
                          cpu: "250m"
                          ephemeral-storage: "1Gi"
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: "256Mi"
                - name: aspnet-tmp
                  emptyDir:
                      sizeLimit: "256Mi"
            imagePullSecrets:
                - name: acr-secret

---
# HRS Email Service
apiVersion: v1
kind: Service
metadata:
    name: hrs-email-service
    namespace: __NAMESPACE__
    labels:
        app: hrs-email-service
spec:
    type: ClusterIP
    ports:
        - port: 80
          targetPort: 8080
          protocol: TCP
          name: http
    selector:
        app: hrs-email-service
