name: HRS Email Service CI/CD

on:
    pull_request:
        branches: [develop]
    push:
        branches: [develop]
        tags:
            - "v*.*.*"

permissions:
    contents: read
    pull-requests: write
    security-events: write
    packages: read

env:
    DOTNET_VERSION: "8.0.x"
    ACR_NAME: hrsmacr
    IMAGE_NAME: hrs-email-service

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        outputs:
            image-tag: ${{ steps.meta.outputs.tags }}
            image-repository: ${{ steps.meta.outputs.repository }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Authenticate with GitHub Packages
              run: |
                  # Remove existing source if present, then add it
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Create coverage directory
              run: mkdir -p ./coverage

            - name: Install dotnet-coverage tool
              run: dotnet tool install --global dotnet-coverage

            - name: Run tests with coverage
              run: |
                  if [ -d "HRS.Test" ]; then
                    dotnet-coverage collect "dotnet test HRS.Test/HRS.Test.csproj --configuration Release --no-build --verbosity normal" \
                      -f xml -o "./coverage/coverage.xml"

                    dotnet test HRS.Test/HRS.Test.csproj --configuration Release --no-build \
                      --logger "trx;LogFileName=TestResults.trx" \
                      --results-directory ./coverage

                    ls -la ./coverage/
                  else
                    echo "No test projects found, skipping tests."
                  fi

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: Unittest-results
                  path: ./coverage/
                  retention-days: 7

    code-quality:
        name: Code Quality Analysis (SAST)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Install SonarCloud scanner
              run: dotnet tool install --global dotnet-sonarscanner

            - name: Authenticate with GitHub Packages
              run: |
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Download test results
              uses: actions/download-artifact@v4
              with:
                  name: Unittest-results
                  path: ./coverage
              continue-on-error: true

            - name: Begin SonarCloud analysis
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  COVERAGE_PATH=$(readlink -f ./coverage/coverage.xml || echo "")
                  echo "Using coverage file: $COVERAGE_PATH"

                  SONAR_PARAMS=""
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    SONAR_PARAMS="/d:sonar.pullrequest.key=${{ github.event.number }} /d:sonar.pullrequest.branch=${{ github.head_ref }} /d:sonar.pullrequest.base=${{ github.base_ref }}"
                  else
                    SONAR_PARAMS="/d:sonar.branch.name=${{ github.ref_name }}"
                  fi

                  dotnet-sonarscanner begin \
                    /k:"hrs-org_hrs-email-service-api" \
                    /o:"hrs-org" \
                    /d:sonar.projectBaseDir="$(pwd)" \
                    /d:sonar.token="$SONAR_TOKEN" \
                    /d:sonar.host.url="https://sonarcloud.io" \
                    /d:sonar.cs.vstest.reportsPaths="./coverage/TestResults.trx" \
                    /d:sonar.cs.vscoveragexml.reportsPaths="$COVERAGE_PATH" \
                    /d:sonar.coverage.exclusions="**/HRS.Test/**,**/*Test*.cs,**/Migrations/**,**/Program.cs" \
                    /d:sonar.exclusions="**/Migrations/**" \
                    /d:sonar.scm.disabled=true \
                    /d:sonar.qualitygate.wait=false \
                    $SONAR_PARAMS

            - name: Restore dependencies
              run: dotnet restore

            - name: Build for SonarCloud analysis
              run: dotnet build --configuration Release --no-restore

            - name: End SonarCloud analysis
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    lint:
        name: Lint and Code Quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Authenticate with GitHub Packages
              run: |
                  # Remove existing source if present, then add it
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Restore dependencies
              run: dotnet restore

            - name: Check code formatting
              run: |
                  dotnet format --verify-no-changes --verbosity diagnostic || echo "Code formatting issues found"

            - name: Run code analysis
              run: |
                  dotnet build --configuration Release /p:TreatWarningsAsErrors=false /p:RunAnalyzers=true

    security-scan:
        name: Security Scan - Software Composition Analysis (SCA)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Authenticate with GitHub Packages
              run: |
                  # Remove existing source if present, then add it
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Restore dependencies
              run: dotnet restore

            - name: Check for vulnerable packages
              run: |
                  dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
                  if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
                    echo "::warning::Vulnerable packages found. Please review and update."
                    cat vulnerable-packages.txt
                    exit 1
                  else
                    echo "No vulnerable packages found."
                  fi

            - name: Check for deprecated packages
              run: |
                  dotnet list package --deprecated 2>&1 | tee deprecated-packages.txt
                  if grep -q "has the following deprecated packages" deprecated-packages.txt; then
                    echo "::warning::Deprecated packages found. Consider updating."
                    cat deprecated-packages.txt
                    exit 1
                  else
                    echo "No deprecated packages found."
                  fi

    secret-scan:
        name: Scan for Secrets
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Gitleaks CLI
              run: |
                  GITLEAKS_VERSION="8.24.2"
                  ASSET_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

                  FINAL_URL=$(curl --silent --show-error --location \
                      --proto '=https' --tlsv1.2 --max-redirs 5 \
                      --output /dev/null --write-out '%{url_effective}' "$ASSET_URL")

                  case "$FINAL_URL" in
                      https://github.com/*|https://objects.githubusercontent.com/*|https://github-releases.githubusercontent.com/*|https://release-assets.githubusercontent.com/*)
                      echo "Resolved download host is trusted: $FINAL_URL"
                      ;;
                      *)
                      echo "Untrusted redirect target: $FINAL_URL"
                      exit 1
                      ;;
                  esac

                  curl --silent --show-error --location \
                      --proto '=https' --tlsv1.2 --max-redirs 5 \
                      --output gitleaks.tar.gz "$ASSET_URL"
                  tar -xzf gitleaks.tar.gz gitleaks
                  sudo mv gitleaks /usr/local/bin/gitleaks
                  gitleaks version

            - name: Run Gitleaks Scan
              run: gitleaks detect --source . --verbose --redact --exit-code 1

    Container-Security-Scan:
        name: Run Trivy Scan- Container Security Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy FS Scan
              uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "table"
                  exit-code: "1" # ❗ fail pipeline if vulnerabilities found
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

            - name: Build Docker Image
              env:
                  DOCKER_BUILDKIT: 1
                  PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
              run: docker build --secret id=github_token,env=PACKAGES_READ_TOKEN -t my-app:latest -f ./Dockerfile .

            - name: Run Trivy Image Scan
              uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
              with:
                  image-ref: "my-app:latest"
                  format: "table"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

            - name: Generate SARIF Report
              uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-results.sarif"

            - name: Upload SARIF to GitHub Security
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-results.sarif"

    pre-dast:
        name: Pre-DAST Security Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Build Docker image for pre-DAST
              env:
                  DOCKER_BUILDKIT: 1
                  PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
              run: docker build --secret id=github_token,env=PACKAGES_READ_TOKEN -t pre-dast-email-service:latest -f ./Dockerfile .

            - name: Run Docker image locally
              run: |
                  echo "Starting container..."
                  docker run -d -p 5001:80 --name pre-dast-email-service \
                    -e ASPNETCORE_ENVIRONMENT=Production \
                    -e Email__SmtpHost="${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}" \
                    -e Email__SmtpPort="${{ secrets.SMTP_PORT || '587' }}" \
                    -e Email__SmtpUsername="${{ secrets.SMTP_USERNAME || 'hikingrentalstore@gmail.com' }}" \
                    -e Email__SmtpPassword="${{ secrets.SMTP_PASSWORD || '' }}" \
                    -e Email__FromEmail="${{ secrets.FROM_EMAIL || 'hikingrentalstore@gmail.com' }}" \
                    -e Email__FromName="${{ secrets.FROM_NAME || 'Hiking Rental Store Team' }}" \
                    -e Email__FrontendUrl="${{ secrets.ALLOWED_ORIGINS || 'http://localhost:4200' }}" \
                    -e AllowedOrigins="${{ secrets.FRONTEND_URL || 'http://localhost:4200' }}" \
                    pre-dast-email-service:latest

                  echo "Waiting for application to start..."
                  sleep 20

                  echo "Container status:"
                  docker ps -a

                  echo "Container logs:"
                  docker logs pre-dast-email-service

                  echo "Testing health endpoint:"
                  curl -f http://localhost:5001/health || echo "Health endpoint not available"

            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@99b9334bed0a0ff8d797764e76c9ecae53168436 # v0.10.0
              with:
                  target: "http://localhost:5001"
                  cmd_options: "-a -j -l WARN -T 10 -I"

            - name: Upload DAST scan results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: pre-dast-scan-results
                  path: |
                      report_html.html
                      report_json.json
                      report_md.md
                      report_xml.xml
                  retention-days: 7

            - name: Cleanup pre-DAST container
              if: always()
              run: docker rm -f pre-dast-email-service || true

    docker-build:
        name: Build & Push Docker Image to ACR
        runs-on: ubuntu-latest
        needs: [build, code-quality, lint, security-scan, secret-scan, Container-Security-Scan, pre-dast]
        if: github.event_name == 'push'
        environment: uat
        outputs:
            version: ${{ steps.version.outputs.version }}
            image-tag: ${{ steps.version.outputs.image-tag }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Nerdbank.GitVersioning
              run: dotnet tool install --global nbgv

            - name: Determine version
              id: version
              run: |
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                    # Tagged release: v1.2.3 → 1.2.3
                    VERSION=${GITHUB_REF#refs/tags/v}
                    IMAGE_TAG="$VERSION"
                    echo "📦 Building RELEASE version: $VERSION"
                  else
                    # Development build: use valid SemVer with prerelease tag
                    SHORT_SHA=$(git rev-parse --short HEAD)
                    # Get version from nbgv, but use valid SemVer format: 1.0.1-dev.abc123
                    BASE_VERSION=$(nbgv get-version -v Version | cut -d'.' -f1-3)
                    VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
                    IMAGE_TAG="dev-${SHORT_SHA}"
                    echo "📦 Building DEV version: $VERSION (image tag: $IMAGE_TAG)"
                  fi

                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Azure
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Log in to Azure Container Registry
              run: |
                  az acr login --name ${{ secrets.ACR_NAME }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                  secrets: |
                      github_token=${{ secrets.PACKAGES_READ_TOKEN }}
                  tags: |
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:${{ steps.version.outputs.image-tag }}
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:latest
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

            - name: Create deployment info
              run: |
                  mkdir -p artifacts
                  cat > artifacts/deployment-info.txt <<EOF
                  VERSION=${{ steps.version.outputs.version }}
                  IMAGE_TAG=${{ steps.version.outputs.image-tag }}
                  COMMIT_SHA=${{ github.sha }}
                  BRANCH=${{ github.ref_name }}
                  BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
                  TRIGGERED_BY=${{ github.actor }}
                  EOF

                  echo "📄 Deployment Info:"
                  cat artifacts/deployment-info.txt

            - name: Upload deployment info
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-info
                  path: artifacts/deployment-info.txt
                  retention-days: 30

    dast:
        name: DAST Security Scan
        runs-on: ubuntu-latest
        needs: [pre-dast, docker-build]
        if: github.event_name == 'push'
        environment: uat
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Log in to Azure
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Pull and run Docker image
              env:
                  IMAGE_TAG: ${{ needs.docker-build.outputs.image-tag }}
              run: |
                  az acr login --name ${{ secrets.ACR_NAME }}

                  echo "Image tag from docker-build: ${IMAGE_TAG}"

                  if [ -z "$IMAGE_TAG" ]; then
                    echo "ERROR: IMAGE_TAG is empty!"
                    echo "Using 'latest' as fallback"
                    IMAGE_TAG="latest"
                  fi

                  echo "Pulling image: ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:${IMAGE_TAG}"
                  docker pull ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:${IMAGE_TAG}

                  echo "Starting container..."
                  docker run -d -p 5000:80 --name hrs-email-service \
                    -e ASPNETCORE_ENVIRONMENT=Production \
                    -e Email__SmtpHost="${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}" \
                    -e Email__SmtpPort="${{ secrets.SMTP_PORT || '587' }}" \
                    -e Email__SmtpUsername="${{ secrets.SMTP_USERNAME || 'hikingrentalstore@gmail.com' }}" \
                    -e Email__SmtpPassword="${{ secrets.SMTP_PASSWORD || '' }}" \
                    -e Email__FromEmail="${{ secrets.FROM_EMAIL || 'hikingrentalstore@gmail.com' }}" \
                    -e Email__FromName="${{ secrets.FROM_NAME || 'Hiking Rental Store Team' }}" \
                    -e Email__FrontendUrl="${{ secrets.ALLOWED_ORIGINS || 'http://localhost:4200' }}" \
                    -e AllowedOrigins="${{ secrets.FRONTEND_URL || 'http://localhost:4200' }}" \
                    ${{ secrets.ACR_NAME }}.azurecr.io/hrs-email-service:${IMAGE_TAG}

                  echo "Waiting for application to start..."
                  sleep 20

                  echo "Container status:"
                  docker ps -a

                  echo "Container logs:"
                  docker logs hrs-email-service

                  echo "Testing health endpoint:"
                  curl -f http://localhost:5000/health || echo "Health endpoint not available"

            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@99b9334bed0a0ff8d797764e76c9ecae53168436 # v0.10.0
              with:
                  target: "http://localhost:5000"
                  cmd_options: "-a -j -l WARN -T 10 -I"

            - name: Upload DAST scan results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: dast-scan-results
                  path: |
                      report_html.html
                      report_json.json
                      report_md.md
                      report_xml.xml
                  retention-days: 7

            - name: Cleanup DAST container
              if: always()
              run: docker rm -f hrs-email-service || true
